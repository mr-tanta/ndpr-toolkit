# pnpm settings live here (not .npmrc) so they're honored consistently across
# pnpm 10 and 11 — pnpm 11 ignores these keys in .npmrc, which previously left
# the lockfile's autoInstallPeers out of sync with CI and broke --frozen-lockfile.
# Companion packages are workspace projects. The nested packages/ndpr-toolkit
# manifest intentionally remains excluded because the repository root already
# owns the same package name.
packages:
  - 'packages/create-ndpr'
  - 'packages/create-ndpr-unscoped'
  - 'packages/ndpr-recipes'

autoInstallPeers: true

# These security overrides are INTENTIONALLY duplicated in package.json
# pnpm.overrides — keep both blocks identical when adding/changing an entry:
# - pnpm 10 has an open lockfile bug (pnpm/pnpm#10614) that strips overrides
#   defined only here from pnpm-lock.yaml on install; the package.json copy is
#   what keeps them pinned. Don't delete it until that bug is fixed for the
#   pnpm version pinned in package.json#packageManager.
# - pnpm 11 silently ignores package.json pnpm.overrides (pnpm/pnpm#11536),
#   so this block is what pnpm 11 actually reads.
overrides:
  handlebars: '>=4.7.9'
  lodash: '>=4.17.21'
  # ^ not >= — test-exclude (jest coverage) does promisify(glob), which breaks on glob 9+
  glob: '^7.2.3'
  tar: '>=7.5.10'
  # ^4.3.0 not >=4.3.0 — GHSA merge-key quadratic CPU fix landed in 4.3.0, but
  # js-yaml 5.x is a breaking major that cosmiconfig/commitlint can't consume.
  js-yaml: '^4.3.0'
  yaml: '>=2.8.3'
  picomatch: '>=2.3.2'
  flatted: '>=3.4.2'
  dompurify: '>=3.4.12'
  esbuild: '>=0.28.1'
  brace-expansion: '>=5.0.7'
  fast-xml-parser: '>=5.7.0'
  '@protobufjs/utf8': '>=1.1.1'
  # ^3.1.4 not >=3.1.4 — host-confusion fixes landed in 3.1.3/3.1.4, but ajv
  # declares fast-uri ^3, so a >= pin would drag in the incompatible 4.x major.
  fast-uri: '^3.1.4'
  postcss: '>=8.5.18'
  ws: '>=8.20.1'
  fast-xml-builder: '>=1.1.7'
  # next declares sharp ^0.34.5 as an optional dep, but 0.34.x inherits libvips
  # CVEs (CVE-2026-33327 et al). Safe to force: the site builds with
  # output:'export' + images.unoptimized, so sharp is never on the render path.
  sharp: '>=0.35.0'
