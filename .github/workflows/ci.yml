name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile (3.10.6): CI must build from the locked deps so a
        # PR with a package.json change that isn't reflected in pnpm-lock.yaml
        # fails fast instead of silently drifting.
        run: pnpm install --frozen-lockfile

      - name: Build library package boundary
        # Recipes and the docs site both resolve @tantainnovative/ndpr-toolkit
        # through the root package's own exports map (Node/webpack
        # self-reference), which points at ./dist. Build it first so every
        # later check reads fresh declarations instead of stale output that
        # could hide a package-boundary error.
        run: pnpm build:lib

      - name: Type check backend recipes
        # Generates the pinned Prisma client before root tsc follows imports
        # from maintained recipe regression tests.
        run: pnpm typecheck:recipes

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify generated create-ndpr scaffolds
        # Render all Next App, Next Pages, and Express branches for Prisma,
        # Drizzle, and no ORM; generate Prisma types; then run strict tsc.
        run: pnpm verify:create-ndpr

      - name: Type check Storybook
        run: pnpm typecheck:storybook

      # The library was built before recipe typechecking so all following
      # artifact tests inspect the same fresh package boundary.

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Upload coverage report
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Verify entry points
        # Entry list synced with publish.yml — both check 22 entries.
        run: |
          for entry in index core server hooks headless adapters presets consent dsr dpia breach policy lawful-basis cross-border ropa lawful-basis-lite cross-border-lite ropa-lite unstyled presets-consent presets-dsr presets-policy; do
            for ext in js mjs d.ts; do
              if [ ! -f "dist/$entry.$ext" ]; then
                echo "MISSING: dist/$entry.$ext"
                exit 1
              fi
            done
          done
          if [ ! -f "dist/styles.css" ]; then
            echo "MISSING: dist/styles.css"
            exit 1
          fi
          echo "All 22 entry points + styles.css verified (js + mjs + d.ts)"

      - name: Verify tarball — every subpath resolves (ESM + CJS + TS)
        # Same gate that runs in publish.yml right before `npm publish`.
        # Running it on PRs catches broken exports at review time.
        run: pnpm verify:tarball --skip-build
