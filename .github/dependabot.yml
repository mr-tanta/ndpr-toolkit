# Dependabot config — automated PRs for outdated dependencies.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # GitHub Actions ecosystem — keeps actions/checkout@v4 etc. fresh and
  # surfaces SHA-pinning opportunities.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      # init/autobuild/analyze MUST move together. init stamps its version into
      # the config file that analyze later loads, so a split bump fails the job
      # with "Loaded a configuration file for version X, but running version Y"
      # (see PR #100). Grouping them keeps the three SHAs identical.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # npm ecosystem — the root package.json and the pnpm workspace projects
  # (packages/create-ndpr, packages/create-ndpr-unscoped, packages/ndpr-recipes)
  # that resolve through the root lockfile.
  #
  # NOTE: examples/** is deliberately NOT covered. Those apps are outside the
  # pnpm workspace (see pnpm-workspace.yaml#packages), have no lockfile, and are
  # not reachable from directory "/" — so they receive no version-update PRs and
  # never appear in `pnpm audit`. Dependabot *alerts* still scan them, which is
  # the only reason the astro advisories in examples/ssr/astro surfaced at all.
  # Adding "directories" entries for them would fix that, but all 14 example
  # manifests pin @tantainnovative/ndpr-toolkit independently, so it needs a
  # covering group first or it opens a PR per app.
  #
  # Grouped to avoid PR storms; security updates always open their own PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # @commitlint/cli and @commitlint/config-conventional must move together.
      # config-conventional 21.2.0 pulls
      # conventional-changelog-conventionalcommits@10, whose exports map the
      # older @commitlint/resolve-extends bundled with cli 21.0.2 cannot resolve
      # — the commit-msg hook dies with ERR_PACKAGE_PATH_NOT_EXPORTED. Nothing in
      # CI catches that, because commitlint only runs in the git hook.
      commitlint:
        patterns:
          - "@commitlint/*"
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "ts-*"
          - "jest*"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      docs-site:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "tailwindcss"
        update-types:
          - "patch"
